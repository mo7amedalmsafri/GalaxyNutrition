# ══════════════════════════════════════════════════════════════════
#  Galaxy Nutrition — Codemagic iOS build (no Mac needed)
#
#  Setup at https://codemagic.io :
#  1. Sign up with your GitHub account → add this repository
#  2. Team settings → integrations → App Store Connect:
#     add an API key from https://appstoreconnect.apple.com/access/integrations/api
#     (Keys tab → "+" → role: App Manager → download the .p8 file)
#  3. Codemagic → app settings → iOS code signing:
#     enable "Automatic" signing with the same App Store Connect key
#  4. Create the app entry in App Store Connect first:
#     My Apps → "+" → New App → bundle ID: com.dietak.app
#  5. Start a build with the "ios-release" workflow → uploads to TestFlight
# ══════════════════════════════════════════════════════════════════

workflows:
  ios-release:
    name: iOS Release (TestFlight / App Store)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: dietak-asc-key   # name your API key this in Codemagic
    environment:
      groups:
        - appstore   # holds CERTIFICATE_PRIVATE_KEY (added in Codemagic UI)
      vars:
        BUNDLE_ID: com.dietak.app
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: npm ci

      - name: Sync Capacitor iOS project
        script: npx cap sync ios

      - name: Set up code signing certificate
        script: |
          # Persistent private key (CERTIFICATE_PRIVATE_KEY env var) keeps the
          # distribution certificate + its private key valid across builds.
          # use-profiles then configures the Xcode project AND writes the
          # export options plist that the Build IPA step needs.
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key "@env:CERTIFICATE_PRIVATE_KEY" \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Increment build number
        script: |
          cd ios/App
          agvtool new-version -all $(($(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" 2>/dev/null || echo 0) + 1))

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Set to true later when ready for public App Store release:
        submit_to_app_store: false
